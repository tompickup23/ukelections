<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Estate Open Graph card on the shared dark ground. Kept only as a source
       reference for the committed PNG: crawlers are served /og-default.png. -->
