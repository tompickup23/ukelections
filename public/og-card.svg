  <rect x="70" y="60" width="64" height="64" rx="12" fill="#0f1317"/>
  <rect x="84" y="70" width="36" height="44" rx="5" fill="#e3d9c3"/>
  <path d="M94 85l16 16M110 85L94 101" stroke="#0f1317" stroke-width="6.5" stroke-linecap="round" fill="none"/>
  <text x="150" y="96" fill="#f4f6f7" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="600">UK Elections</text>
  <text x="150" y="122" fill="#98a3ac" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1">FORECASTING EVERY COUNCIL AND CONSTITUENCY</text>
