name: Site checks

# Lite-CI lane for pull requests.
#
# Runs the cheap, data-independent checks that catch regressions without
# requiring the gitignored ~74 MB AI DOGE / HP v7.0 / DC historic-results
# data corpus. Specifically:
#
#   - vitest unit tests       — pure JS/TS logic
#   - validate:backend        — structural validation of committed data
#   - astro check             — full TypeScript + .astro typecheck
#
# We deliberately do NOT run `npm run build` here. The full build needs
# the gitignored historic data and is reproduced on vps-main daily at
# 04:30 UTC, then deployed to Cloudflare Pages. Branch protection treats
# this lane as the PR-time gate; the canonical build acceptance happens
# on push-to-main via the GH Pages mirror in deploy.yml.
#
# Security note: every `run:` step below is pure npm/shell invocation
# against checked-in package.json scripts — no `${{ github.event.* }}`
# interpolation, no untrusted PR data flows into a shell argument, so
# there is no command-injection surface.

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate:backend
      - run: npm run check
